let yLo = bbox[4], yHi = bbox[5], onlyTop = false;

// ---- 相机 ----
// 自动取景：按 bbox 最大水平跨度定初始距离，避免地形只占画面一角
const SPAN = Math.max(bbox[1] - bbox[0], bbox[3] - bbox[2]);
let yaw = -0.7, pitch = 0.9, dist = Math.max(120, SPAN * 1.1), fov = 900, panX = 0, panZ = 0;

function project(x, y, z) {
  const X = x - cx - panX, Y = y - (bbox[4] + bbox[5]) / 2, Z = z - cz - panZ;
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const x1 =  X * cy - Z * sy;
  const z1 =  X * sy + Z * cy;
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const y1 =  Y * cp - z1 * sp;
  const z2 =  Y * sp + z1 * cp;
  const d = z2 + dist;
  if (d < 8) return null;
  const s = fov / d;
  return { sx: W / 2 + x1 * s, sy: H / 2 - y1 * s, d, s };
}

let lastFps = 0, frames = 0;
function draw(ts_) {
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, W, H);

  // 收集可见点并算深度
  const vis = [];
  for (let i = 0; i < N; i++) {
    const p = pts[i];
    if (!show[p.t]) continue;
    if (p.y < yLo || p.y > yHi) continue;
    if (onlyTop && topY.get(p.x + ',' + p.z) !== p.y) continue;
    const q = project(p.x, p.y, p.z);
    if (q) { q.y = p.y; q.t = p.t; vis.push(q); }
  }
  // 远 → 近
  vis.sort((a, b) => b.d - a.d);

  const size = Math.max(1.2, fov / dist * 1.15);
  for (const q of vis) {
    const shade = 0.55 + 0.45 * ((q.y - bbox[4]) / Math.max(1, bbox[5] - bbox[4]));
    ctx.fillStyle = TCOL[q.t];
    ctx.globalAlpha = 0.55 + 0.45 * shade;
    const s = size * (fov / q.d) / (fov / dist) * 1.0;
    ctx.fillRect(q.sx - s / 2, q.sy - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
  document.getElementById('sDraw').textContent = vis.length.toLocaleString();

  frames++;
  const now = performance.now();
  if (now - lastFps > 500) {
    document.getElementById('fps').textContent = Math.round(frames * 1000 / (now - lastFps)) + ' fps · ' + N.toLocaleString() + ' 点';
    frames = 0; lastFps = now;
  }
}

// ---- 交互 ----
let dragging = false, panning = false, lastX = 0, lastY = 0;
cv.addEventListener('mousedown', e => {
  if (e.button === 2) panning = true; else dragging = true;
  lastX = e.clientX; lastY = e.clientY;
  cv.classList.add('drag');
});
addEventListener('mouseup', () => { dragging = panning = false; cv.classList.remove('drag'); });
addEventListener('mousemove', e => {
  if (!dragging && !panning) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  if (dragging) {
    yaw -= dx * 0.006;
    pitch = Math.max(-0.2, Math.min(1.5, pitch + dy * 0.005));
  } else {
    const k = dist / fov * 1.4;
    panX += (dx * Math.cos(yaw) - dy * Math.sin(yaw)) * k;
    panZ += (dx * Math.sin(yaw) + dy * Math.cos(yaw)) * k;
  }
  draw();
});
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('wheel', e => {
  e.preventDefault();
  dist = Math.max(60, Math.min(2000, dist * (1 + Math.sign(e.deltaY) * 0.12)));
  draw();
}, { passive: false });

for (let t = 0; t <= 6; t++) {
  document.getElementById('t' + t).addEventListener('change', e => { show[t] = e.target.checked; draw(); });
}
const yLoEl = document.getElementById('yLo'), yHiEl = document.getElementById('yHi');
yLoEl.min = yHiEl.min = bbox[4]; yLoEl.max = yHiEl.max = bbox[5];
yLoEl.value = bbox[4]; yHiEl.value = bbox[5];
function syncY() {
  yLo = +yLoEl.value; yHi = +yHiEl.value;
  if (yLo > yHi) { if (this === yLoEl) yLo = yHi; else yHi = yLo; }
  document.getElementById('yLoV').textContent = yLo;
  document.getElementById('yHiV').textContent = yHi;
  draw();
}
yLoEl.addEventListener('input', syncY);
yHiEl.addEventListener('input', syncY);
document.getElementById('yReset').onclick = () => { yLoEl.value = bbox[4]; yHiEl.value = bbox[5]; syncY(); };
document.getElementById('topOnly').onclick = () => { onlyTop = !onlyTop; draw(); };

// ---- 启动 ----
document.getElementById('sTotal').textContent = N.toLocaleString();
document.getElementById('sCols').textContent = topY.size.toLocaleString();
document.getElementById('sMulti').textContent = DATA.multiColumns.toLocaleString();
document.getElementById('sY').textContent = bbox[4] + ' ~ ' + bbox[5];
resize(); syncY();
requestAnimationFrame(function loop() { if (!dragging && !panning) { /* 静态时按需重绘 */ } requestAnimationFrame(loop); });
</script>
</body>
</html>
