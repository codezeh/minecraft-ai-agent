services:
  mindcraft:
    build: .
    environment:
      SETTINGS_JSON: |
        {"auto_open_ui": false}
      # ★ OPS-010（2026-11-06 深度检查）：容器内必须监听 0.0.0.0，
      #   否则发布出去的端口永远连不到（容器里的 localhost 是容器自己的回环）。
      #   默认值保持不变（只绑 localhost），这里的放开只影响本容器。
      MIND_SERVER_HOST: "0.0.0.0"
      # ★ F3（2026-11-07 真机验收）：把控制台令牌显式交给容器，宿主机才拿得到。
      #   为什么选 env 而不是 bind-mount `.mindserver-token`：
      #     mindserver 在**进程退出时会删掉** token 文件（F-RT-003 减少留存窗口）。
      #     若把该文件 bind-mount 进容器，容器退出时宿主侧那份也会被删；而下次 `up` 时
      #     Docker 发现宿主路径不存在，会**建一个同名目录**顶上去 ⇒ writeFileSync 直接 EISDIR，
      #     token 从此再也拿不到（而且报错只在容器日志里，很像"玄学故障"）。
      #     改用 env 就没这个问题：值由宿主决定，容器只是用它，不再依赖文件生命周期。
      #   用法：`export MINDSERVER_TOKEN=$(openssl rand -hex 24)` 或写进同目录 .env 文件。
      #   `:?` 让未设置时 compose 立刻报错并打印这句话，而不是起一个"拿不到令牌"的容器。
      MINDSERVER_TOKEN: "${MINDSERVER_TOKEN:?请先设置 MINDSERVER_TOKEN（控制台握手令牌），例如 export MINDSERVER_TOKEN=$(openssl rand -hex 24)}"
    volumes:
      - ./settings.js:/app/settings.js
      - ./keys.json:/app/keys.json
      - ./profiles:/app/profiles
      - ./bots:/app/bots
    ports:
      # ★ F4（2026-11-07 真机验收）：原来写 `"3000-3003:3000-3003"`，未指定宿主 IP
      #   ⇒ 实际绑到 **0.0.0.0**，局域网可直接看 bot 摄像头画面 —— 与本节"只绑回环"的口径冲突。
      #   现在收回到 127.0.0.1，与 8080 保持一致。
      - "127.0.0.1:3000-3003:3000-3003" # see the view from the camera mounted on your bot head: http://127.0.0.1:3000/
      # ★ OPS-010：**固定**宿主端口并只绑回环。
      #   原来写 `- 8080`（不指定宿主端口）⇒ 宿主随机映射，脚本里硬编码的 8080 对不上，
      #   而且会绑到 0.0.0.0 让局域网都能访问控制台。
      #   现在：宿主 127.0.0.1:8080 → 容器 8080，访问地址始终是 http://127.0.0.1:8080/?token=…
      - "127.0.0.1:8080:8080" # Mindserver port (loopback only)
    extra_hosts:
    - "host.docker.internal:host-gateway"

  viaproxy: #use this service to connect to an unsupported minecraft server versions. more info: ./services/viaproxy/README.md
    image: ghcr.io/viaversion/viaproxy:latest
    volumes:
      - ./services/viaproxy:/app/run
    ports:
      # R6 #52：原来没写宿主 IP ⇒ 绑到 0.0.0.0，与本文件其它端口"只绑回环"的口径冲突；
      # 而且 25568 正是 restore-drill.ps1 的默认 -RconPort，演练端口预检会必然报占用。
      - "127.0.0.1:25568:25568"
    profiles:
      - viaproxy
    stdin_open: true
    tty: true
